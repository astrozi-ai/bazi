name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
  playground:
    runs-on: ubuntu-latest
    env:
      NSH_VERSION: v0.4.0
      NSH_ASSET: nsh-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run engine:nsh
      - name: Install NSH
        run: |
          base="https://github.com/longbridge/nsh/releases/download/$NSH_VERSION/$NSH_ASSET"
          curl -fsSL "$base" -o "$RUNNER_TEMP/$NSH_ASSET"
          curl -fsSL "$base.sha256" -o "$RUNNER_TEMP/$NSH_ASSET.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$NSH_ASSET.sha256")
          tar -xzf "$RUNNER_TEMP/$NSH_ASSET" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nsh/bin" >> "$GITHUB_PATH"
      - run: nsh check apps/playground
      - run: nsh build apps/playground
      - run: nsh test apps/playground
